name: Conference calendar
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * *'

permissions:
  contents: read

concurrency:
  group: conference-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh CCFDDL snapshot
        run: python3 sync_ccf.py --output conferences.js
      - name: Validate and stage the site
        run: |
          node --check app.js
          node --check globe-view.js
          node --check venues.js
          node check.cjs --browser
          mkdir public
          cp index.html style.css globe.css app.js globe-view.js conferences.js venues.js world.svg CCFDDL-LICENSE.txt public/
          cp -R assets vendor public/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    if: github.event.repository.private == false
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: publish
        uses: actions/deploy-pages@v4
